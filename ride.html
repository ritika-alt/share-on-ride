<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Api</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            padding: 8px;
            border-collapse: collapse;
            margin: 50px 10px 50px 50px;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:hover td:not(:last-child) {
            background-color: #1d6ad4;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            color: #007BFF;
            font-weight: 700;
        }

        .form-box1 {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            margin: 100px auto;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            cursor: pointer
        }

        .successModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 11;
        }

        .okbtn {
            padding: 8px 16px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .ride {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            margin: 100px auto;
            text-align: center;
        }

        @media (max-width: 768px) {

            table,
            th,
            td {
                font-size: 14px;
                margin: 20px;
            }

            .form-box1,
            .ride {
                width: 80%;
                margin: 50px auto;
                padding: 15px;
            }

            .okbtn {
                width: 100%;
                padding: 10px;
            }
        }


        @media (max-width: 480px) {

            table,
            th,
            td {
                font-size: 12px;
                padding: 6px;
                margin: 10px;
                display: block;
                width: 100%;
                overflow-x: auto;
            }

            th,
            td {
                display: block;
                width: 100%;
            }

            .form-box1,
            .ride {
                width: 90%;
                padding: 10px;
                margin: 30px auto;
            }

            .close-btn {
                top: 5px;
                right: 10px;
                font-size: 16px;
            }

            .okbtn {
                font-size: 14px;
                padding: 10px;
                width: 100%;
            }

            h2 {
                font-size: 20px;
                margin: 15px 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="https://cdn.shopify.com/s/files/1/0558/6413/1764/files/Rainbow_Logo_Design_29_1024x1024.jpg?v=1680141974"
                alt="logo" class="logo">
        </div>
        <div>
            <ul class="a">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="ride.html">Ride</a></li>
                <li><a href="search.html">Search</a></li>
            </ul>
        </div>
    </nav>
    <h2>Current Rides</h2>
    <table class="table">
        <thead class="thead-dark">
            <tr>
                <th scope="col">RideId</th>
                <th scope="col">Source</th>
                <th scope="col">Destination</th>
                <th scope="col">Date</th>
                <th scope="col">Time</th>
                <th scope="col">DriverName</th>
                <th scope="col">DriverContact</th>
                <th scope="col">VehicleType</th>
                <th scope="col">VehicleNumber</th>
                <th scope="col">AvailableSeats</th>
                <th scope="col">Fare</th>
                <th scope="col">EstimatedDuration</th>
                <th scope="col">Button</th>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>


    <div id="rideModal" class="modal">
        <div class="form-box1">
            <span class="close-btn" id="closeModal">&times;</span>
            <form id="rideform">
                <label for="name">Person Name:</label>
                <input type="text" id="name" name="name" required style="width:100%; padding:5px; margin-bottom:10px;">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required
                    style="width:100%; padding:5px; margin-bottom:10px;">

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required style="width:100%; padding:5px; margin-bottom:10px;">

                <input type="submit" value="Submit"
                    style="width:100%; background:#343a40; color:white; border:none; padding:8px; border-radius:4px;">
            </form>
        </div>
    </div>
    <div id="successModal" class="successModal">
        <div class="ride">
            <p>✅ Ride Booked Successfully!</p>
            <button id="okButton" class="okbtn">OK</button>
        </div>
    </div>



    <footer class="footer">
        <div class="icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-whatsapp"></i>
            <i class="fa-brands fa-linkedin-in"></i>
        </div>
        <hr class="footer-hr">
        <div class="boxes">
            <div class="left-boxes">
                <a href="services.html" class="box" id="services">Services</a>
                <a href="about.html" class="box" id="about">About</a>
                <a href="index.html" class="box" id="home">Home</a>
            </div>
            <div class="right-box">
                <div class="form-box">
                    <h3>Connect with us</h3>
                    <input type="email" placeholder="Enter Email" class="email-box">
                    <textarea placeholder="Enter Message" class="message-box"></textarea>
                </div>
            </div>
        </div>

    </footer>
</body>
<script src="ridejava.js"></script>

</html>
